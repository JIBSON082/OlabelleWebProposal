const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.classList.add('s');io.unobserve(t);setTimeout(()=>{t.classList.remove('rv','s');t.style.transitionDelay=''},1600)}}),{threshold:.1,rootMargin:'0px 0px -6% 0px'});
function prep(v){v.querySelectorAll(SEL).forEach(el=>{const i=[...el.parentNode.children].indexOf(el);el.classList.remove('s');el.classList.add('rv');el.style.transitionDelay=Math.min(i,6)*90+'ms';io.observe(el)})}
function show(id,push=true){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));const v=document.getElementById(id);v.classList.add('on');scrollTo(0,0);prep(v);if(push)history.pushState({id},'')}
history.replaceState({id:'home'},'');prep(document.getElementById('home'));addEventListener('popstate',e=>show(e.state?e.state.id:'home',false));
addEventListener('scroll',()=>{const h=document.documentElement;document.getElementById('prog').style.width=(scrollY/(h.scrollHeight-innerHeight||1)*100)+'%'},{passive:true});
</script></body></html>
